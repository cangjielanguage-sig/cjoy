[dependencies]

[package]
  cjc-version = "1.0.0"
  compile-option = "-Woff unused --diagnostic-format=noColor"
  description = "a fast, lightweight and joy web framework"
  link-option = ""
  name = "cjoy"
  output-type = "static"
  override-compile-option = ""
  src-dir = ""
  target-dir = ""
  version = "0.40.0"
  [package.package-configuration]
    [package.package-configuration."cjoy.examples.chuncked"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.fileserver"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.macros"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.multipart"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.rest"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.simple"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.sse"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.tls"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.websocket"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.mcpserver"]
      output-type = "executable"
    [package.package-configuration."cjoy.examples.mcpclient"]
      output-type = "executable"

[target]
  [target.aarch64-linux-ohos]
    compile-option = "-B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_aarch64_llvm/openssl\" --sysroot \"${DEVECO_CANGJIE_HOME}/musl\" --cfg \"ohos=true\""
    [target.aarch64-linux-ohos.bin-dependencies]
      path-option = [ "${AARCH64_LIBS}", "${AARCH64_MACRO_LIBS}", "${CANGJIE_HOME}/../cangjiestdx/linux_ohos_aarch64_llvm/static/stdx" ]
  [target.x86_64-linux-ohos]
    compile-option = "-B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_x86_64_llvm/openssl\" --sysroot \"${DEVECO_CANGJIE_HOME}/musl\" --cfg \"ohos=true\""
    [target.x86_64-linux-ohos.bin-dependencies]
      path-option = [ "${X86_64_OHOS_LIBS}", "${X86_64_OHOS_MACRO_LIBS}", "${CANGJIE_HOME}/../cangjiestdx/linux_ohos_x86_64_llvm/static/stdx" ]
  [target.x86_64-unknown-linux-gnu]
    compile-option = "--cfg \"ohos=false\""
    [target.x86_64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_HOME}/../cangjiestdx/linux_x86_64_llvm/static/stdx" ]
  [target.aarch64-unknown-linux-gnu]
    compile-option = "--cfg \"ohos=false\""
    [target.aarch64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_HOME}/../cangjiestdx/linux_aarch64_llvm/static/stdx" ]
  [target.x86_64-w64-mingw32]
    compile-option = "--cfg \"ohos=false\""
    link-option = "-lcrypt32"
    [target.x86_64-w64-mingw32.bin-dependencies]
      path-option = [ "${CANGJIE_HOME}/../cangjiestdx/windows_x86_64_llvm/static/stdx" ]
  [target.x86_64-apple-darwin]
    compile-option = "--cfg \"ohos=false\""
    [target.x86_64-apple-darwin.bin-dependencies]
      path-option = [ "${X86_64_MACOS_LIBS}", "${X86_64_MACOS_MACRO_LIBS}", "${CANGJIE_HOME}/../cangjiestdx/darwin_x86_64_llvm/static/stdx" ]
  [target.aarch64-apple-darwin]
    compile-option = "--cfg \"ohos=false\""
    [target.aarch64-apple-darwin.bin-dependencies]
      path-option = [ "${AARCH64_MACOS_LIBS}", "${AARCH64_MACOS_MACRO_LIBS}", "${CANGJIE_HOME}/../cangjiestdx/darwin_aarch64_llvm/static/stdx" ]
