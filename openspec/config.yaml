schema: spec-driven

context: |
  Tech stack: Cangjie
  API conventions: RESTful, JSON responses
  Testing: cjpm test for unit tests
  Language: 中文(简体)

rules:
  proposal:
    - 必须包含回滚计划
  specs:
    - 使用 Given/When/Then 格式编写场景
    - 每个需求至少有一个场景
    - 在创新之前先参考现有模式
  design:
    - 对复杂流程包含序列图
  tasks:
    - 每个任务必须可估算
    - 包含验收标准