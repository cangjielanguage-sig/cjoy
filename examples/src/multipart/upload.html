<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            margin-bottom: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .upload-area {
            border: 3px dashed #3498db;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            margin-bottom: 30px;
            cursor: pointer;
            position: relative;
        }
        
        .upload-area:hover, .upload-area.dragover {
            background-color: #e3f2fd;
            border-color: #2980b9;
        }
        
        .upload-icon {
            font-size: 64px;
            color: #3498db;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .file-input {
            display: none;
        }
        
        .browse-btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
            margin-top: 10px;
        }
        
        .browse-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .file-types {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 10px;
        }
        
        .file-list {
            margin-top: 30px;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8fafc;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .file-icon {
            font-size: 24px;
            margin-right: 15px;
            color: #3498db;
        }
        
        .file-info {
            flex-grow: 1;
        }
        
        .file-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .file-actions {
            display: flex;
            gap: 10px;
        }
        
        .remove-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .upload-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .upload-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .upload-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        
        .progress-bar {
            height: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress {
            height: 100%;
            background-color: #2ecc71;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .file-preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .upload-area {
                padding: 40px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>文件上传工具</h1>
            <p class="subtitle">安全、快速、简单的文件上传解决方案</p>
        </header>
        
        <form id="uploadForm" action="/uploadfile" method="post" enctype="multipart/form-data">
            <div class="upload-area" id="dropArea">
                <div class="upload-icon">📁</div>
                <p class="upload-text">拖放文件到此处或</p>
                <button type="button" class="browse-btn" id="browseBtn">选择文件</button>
                <input type="file" class="file-input" id="fileInput" name="files" multiple>
                <p class="file-types">支持所有文件类型，单个文件最大100MB</p>
            </div>
            
            <div class="file-list" id="fileList"></div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress" id="progressBar"></div>
                </div>
                <p class="progress-text" id="progressText">准备上传...</p>
            </div>
            
            <button type="submit" class="upload-btn" id="uploadBtn" disabled>上传文件</button>
        </form>
        
        <div class="success-message" id="successMessage">
            文件上传成功！
        </div>
        
        <div class="error-message" id="errorMessage">
            上传过程中出现错误，请重试。
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const fileList = document.getElementById('fileList');
            const uploadBtn = document.getElementById('uploadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const uploadForm = document.getElementById('uploadForm');
            
            let files = [];
            
            // 点击浏览按钮触发文件选择
            browseBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 文件选择变化
            fileInput.addEventListener('change', (e) => {
                files = Array.from(e.target.files);
                updateFileList();
                updateUploadButton();
            });
            
            // 拖放事件
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.classList.add('dragover');
            }
            
            function unhighlight() {
                dropArea.classList.remove('dragover');
            }
            
            // 处理文件拖放
            dropArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                files = Array.from(dt.files);
                updateFileList();
                updateUploadButton();
            }
            
            // 更新文件列表显示
            function updateFileList() {
                fileList.innerHTML = '';
                
                if (files.length === 0) {
                    return;
                }
                
                files.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const fileSize = formatFileSize(file.size);
                    
                    fileItem.innerHTML = `
                        <div class="file-icon">${getFileIcon(file.type)}</div>
                        <div class="file-info">
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${fileSize}</div>
                        </div>
                        <div class="file-actions">
                            <button class="remove-btn" data-index="${index}" type="button">×</button>
                        </div>
                    `;
                    
                    fileList.appendChild(fileItem);
                });
                
                // 添加删除按钮事件
                document.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.target.getAttribute('data-index'));
                        files.splice(index, 1);
                        updateFileList();
                        updateUploadButton();
                    });
                });
            }
            
            // 获取文件类型对应的图标
            function getFileIcon(fileType) {
                if (fileType.startsWith('image/')) return '🖼️';
                if (fileType.startsWith('video/')) return '🎬';
                if (fileType.startsWith('audio/')) return '🎵';
                if (fileType.includes('pdf')) return '📄';
                if (fileType.includes('zip') || fileType.includes('rar')) return '📦';
                if (fileType.includes('word') || fileType.includes('document')) return '📝';
                if (fileType.includes('excel') || fileType.includes('spreadsheet')) return '📊';
                return '📄';
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // 更新上传按钮状态
            function updateUploadButton() {
                uploadBtn.disabled = files.length === 0;
            }
            
            // 表单提交事件
            uploadForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (files.length === 0) return;
                
                // 显示进度条
                progressContainer.style.display = 'block';
                successMessage.style.display = 'none';
                errorMessage.style.display = 'none';
                uploadBtn.disabled = true;
                
                // 模拟上传进度
                /*
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 10;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        
                        // 上传完成
                        progressText.textContent = '上传完成！';
                        successMessage.style.display = 'block';
                        
                        // 重置状态
                        setTimeout(() => {
                            files = [];
                            fileInput.value = '';
                            updateFileList();
                            updateUploadButton();
                            progressContainer.style.display = 'none';
                        }, 3000);
                    }
                    
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `上传中... ${Math.round(progress)}%`;
                }, 200);
                */
                
                const formData = new FormData();
                files.forEach(file => {
                    formData.append('files', file);
                });
                
                fetch('/uploadfile', {
                    method: 'POST',
                    body: formData
                })
                //.then(response => response.json())
                .then(data => {
                    // 上传成功处理
                    progressBar.style.width = '100%';
                    progressText.textContent = '上传完成！';
                    successMessage.style.display = 'block';
                    
                    // 重置状态
                    setTimeout(() => {
                        files = [];
                        fileInput.value = '';
                        updateFileList();
                        updateUploadButton();
                        progressContainer.style.display = 'none';
                    }, 3000);
                })
                .catch(error => {
                    // 上传失败处理
                    errorMessage.style.display = 'block';
                    uploadBtn.disabled = false;
                });
             
            });
        });
    </script>
</body>
</html>
