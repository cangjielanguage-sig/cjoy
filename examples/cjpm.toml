[dependencies]
  cjoy = { path = "../"}

[package]
  cjc-version = "1.0.0"
  compile-option = "-Woff unused"
  description = "cjoy examples"
  link-option = ""
  name = "examples"
  output-type = "static"
  override-compile-option = ""
  src-dir = ""
  target-dir = ""
  version = "1.0.0"
  [package.package-configuration]
    [package.package-configuration."examples.chunked"]
      output-type = "executable"
    [package.package-configuration."examples.fileserver"]
      output-type = "executable"
    [package.package-configuration."examples.macros"]
      output-type = "executable"
    [package.package-configuration."examples.multipart"]
      output-type = "executable"
    [package.package-configuration."examples.rest"]
      output-type = "executable"
    [package.package-configuration."examples.restioc"]
      output-type = "executable"     
    [package.package-configuration."examples.simple"]
      output-type = "executable"
    [package.package-configuration."examples.sse"]
      output-type = "executable"
    [package.package-configuration."examples.tls"]
      output-type = "executable"
    [package.package-configuration."examples.websocket"]
      output-type = "executable"
    [package.package-configuration."examples.mcpserver"]
      output-type = "executable"
    [package.package-configuration."examples.mcpclient"]
      output-type = "executable"
    [package.package-configuration."examples.logger"]
      output-type = "executable"
    [package.package-configuration."examples.session"]
      output-type = "executable"
    [package.package-configuration."examples.requestid"]
      output-type = "executable"
    [package.package-configuration."examples.nocache"]
      output-type = "executable"
    [package.package-configuration."examples.tokenauth"]
      output-type = "executable"
    [package.package-configuration."examples.csrf"]
      output-type = "executable"
    [package.package-configuration."examples.multipkgs"]
      output-type = "executable"
    [package.package-configuration."examples.jwtauth"]
      output-type = "executable"
    [package.package-configuration."examples.combination"]
      output-type = "executable"
    [package.package-configuration."examples.schedule"]
      output-type = "executable"
    [package.package-configuration."examples.httpx"]
      output-type = "executable"
    [package.package-configuration."examples.eventbus"]
      output-type = "executable"
    [package.package-configuration."examples.config"]
      output-type = "executable"
    [package.package-configuration."examples.boot"]
      output-type = "executable"

[target]
  [target.aarch64-linux-ohos]
    compile-option = "-B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_aarch64_llvm/openssl\" --sysroot \"${DEVECO_CANGJIE_HOME}/musl\" --cfg \"ohos=true\""
    [target.aarch64-linux-ohos.bin-dependencies]
      path-option = [ "${AARCH64_LIBS}", "${AARCH64_MACRO_LIBS}", "${CANGJIE_STDX_PATH}/linux_ohos_aarch64_llvm/static/stdx" ]
  [target.x86_64-linux-ohos]
    compile-option = "-B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_x86_64_llvm/openssl\" --sysroot \"${DEVECO_CANGJIE_HOME}/musl\" --cfg \"ohos=true\""
    [target.x86_64-linux-ohos.bin-dependencies]
      path-option = [ "${X86_64_OHOS_LIBS}", "${X86_64_OHOS_MACRO_LIBS}", "${CANGJIE_STDX_PATH}/linux_ohos_x86_64_llvm/static/stdx" ]
  [target.x86_64-unknown-linux-gnu]
    compile-option = "--cfg \"ohos=false\""
    [target.x86_64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}/linux_x86_64_llvm/static/stdx" ]
  [target.aarch64-unknown-linux-gnu]
    compile-option = "--cfg \"ohos=false\""
    [target.aarch64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}/linux_aarch64_llvm/static/stdx" ]
  [target.x86_64-w64-mingw32]
    compile-option = "--cfg \"ohos=false\""
    link-option = "-lcrypt32"
    [target.x86_64-w64-mingw32.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}/windows_x86_64_llvm/static/stdx" ]
  [target.x86_64-apple-darwin]
    compile-option = "--cfg \"ohos=false\""
    [target.x86_64-apple-darwin.bin-dependencies]
      path-option = [ "${X86_64_MACOS_LIBS}", "${X86_64_MACOS_MACRO_LIBS}", "${CANGJIE_STDX_PATH}/darwin_x86_64_llvm/static/stdx" ]
  [target.aarch64-apple-darwin]
    compile-option = "--cfg \"ohos=false\""
    [target.aarch64-apple-darwin.bin-dependencies]
      path-option = [ "${AARCH64_MACOS_LIBS}", "${AARCH64_MACOS_MACRO_LIBS}", "${CANGJIE_STDX_PATH}/darwin_aarch64_llvm/static/stdx" ]