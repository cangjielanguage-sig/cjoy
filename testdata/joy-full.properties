# CJoy application configuration
# Complete configuration file with all possible options

# Application name
joy.name=default

# Server configuration
joy.server.address=127.0.0.1
joy.server.port=18880

# TLS/SSL configuration
joy.server.tls.enabled=false
joy.server.tls.version=
joy.server.tls.ciphers=
joy.server.tls.client-auth=false
joy.server.tls.key-password=
joy.server.tls.key-file=../testdata/server_key.pem
joy.server.tls.cert-file=../testdata/server_cert.pem
joy.server.tls.trust-file=
joy.server.tls.trust-all=false

# HTTP configuration
joy.server.http.read-header-timeout=0
joy.server.http.read-timeout=0
joy.server.http.write-timeout=0
joy.server.http.case-insensitive=false
joy.server.http.escape-added-routes=false
joy.server.http.remote-ip-headers=
joy.server.http.max-request-body-size=33554432
joy.server.http.max-request-header-size=0

# HTTP/2 configuration
joy.server.http.h2.enabled=false
joy.server.http.h2.enable-connect-protocol=false
joy.server.http.h2.header-table-size=4096
joy.server.http.h2.initial-window-size=0
joy.server.http.h2.max-concurrent-streams=100
joy.server.http.h2.max-frame-size=16384
joy.server.http.h2.max-header-list-size=4294967295

# Service pool configuration
joy.server.pool.capacity=10000
joy.server.pool.queue-capacity=10000
joy.server.pool.preheat=0
